[package]
name = "hanbova-cdk-ffi"
version = "0.1.0"
edition = "2021"
authors = ["Hanbova Contributors"]
license = "MIT"
description = "C-compatible FFI bindings for official CDK Cashu client wallet"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
cdk = { version = "0.18.0-rc.0", default-features = false, features = ["wallet"] }
cdk-redb = "0.18.0-rc.0"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "1.0"
secp256k1 = { version = "0.29", features = ["serde", "rand", "global-context"] }

[dev-dependencies]
tempfile = "3.10"
uuid = { version = "1.8", features = ["v4"] }
