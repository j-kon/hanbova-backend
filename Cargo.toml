[workspace]
members = [
    "crates/hanbova-core",
    "crates/hanbova-protected-payments",
    "crates/hanbova-lightning",
    "crates/hanbova-cdk-ffi",
    "services/api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hanbova Contributors"]
license = "MIT"
repository = "https://github.com/j-kon/hanbova-backend"

[workspace.dependencies]
# Internal crates
hanbova-core = { path = "crates/hanbova-core" }
hanbova-protected-payments = { path = "crates/hanbova-protected-payments" }
hanbova-lightning = { path = "crates/hanbova-lightning" }

# Serialization & Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"

# Async & Networking
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Database (PostgreSQL only with macros for sqlx::migrate!)
sqlx = { version = "0.7.4", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }

# Auth & Cryptography
argon2 = "0.5"
jsonwebtoken = "9.3"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# Cashu CDK (Pure Rust redb / memory storage)
cdk = { version = "0.18.0-rc.0", default-features = false, features = ["wallet"] }
cdk-redb = "0.18.0-rc.0"
bip39 = "2.0"
secp256k1 = { version = "0.29", features = ["serde", "rand", "global-context"] }
